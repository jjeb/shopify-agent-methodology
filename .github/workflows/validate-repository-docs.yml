name: Validate repository documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository documentation
        run: bash scripts/validate-repository-docs.sh

      - name: Validate versioning
        run: python3 scripts/validate-versioning.py

      - name: Check whitespace
        run: git diff --check
