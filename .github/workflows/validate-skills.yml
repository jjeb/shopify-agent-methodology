name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Agent Skills reference validator
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Run repository checks
        run: bash scripts/validate-skills.sh

      - name: Validate store-pilot scenarios
        run: bash scripts/validate-evaluation-scenarios.sh

      - name: Validate methodology references
        run: bash scripts/validate-methodology.sh

      - name: Validate role documentation links
        run: bash scripts/validate-role-documentation.sh

      - name: Validate multi-role coordination
        run: bash scripts/validate-coordination.sh

      - name: Check whitespace
        run: git diff --check
